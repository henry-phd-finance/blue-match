<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Match — 소개팅 매물 디렉토리 & 궁합 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="h-screen w-screen overflow-hidden flex bg-[#f8fafc] text-zinc-900 select-none">

  <!-- 왼쪽 고정 사이드바 (Square UI 스타일) -->
  <aside class="w-[244px] shrink-0 h-full bg-white border-r border-zinc-200 flex flex-col justify-between p-3.5">
    <div>
      <!-- 상단 브랜드 헤더 -->
      <div class="flex items-center justify-between px-2 py-2 mb-4 border-b border-zinc-100 pb-3.5">
        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded-lg bg-zinc-900 text-white flex items-center justify-center font-bold text-xs tracking-tighter">
            BM
          </div>
          <div>
            <div class="text-sm font-bold tracking-tight text-zinc-900 leading-none">Blue Match</div>
            <div class="text-[11px] text-zinc-400 mt-0.5">Private Matchmaking</div>
          </div>
        </div>
        <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-zinc-100 text-zinc-600 border border-zinc-200">Admin</span>
      </div>

      <!-- 사이드바 섹션 라벨 -->
      <div class="px-2 mb-1.5 text-[11px] font-semibold text-zinc-400 uppercase tracking-wider">
        Workspace
      </div>

      <!-- 사이드바 네비게이션 -->
      <nav id="sidebar-nav" class="space-y-1"></nav>
    </div>

    <!-- 사이드바 하단 요약 & Supabase 연동 상태 -->
    <div id="sidebar-stats" class="pt-3 border-t border-zinc-100"></div>
  </aside>

  <!-- 가운데 메인 워크스페이스 (고정 헤더 + 필터바 + 내부 스크롤 컨텐츠) -->
  <main class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    <!-- 상단 고정 헤더 -->
    <header class="h-14 shrink-0 bg-white border-b border-zinc-200 px-6 flex items-center justify-between">
      <div id="workspace-header-title"></div>
      <div id="workspace-header-actions"></div>
    </header>

    <!-- 디렉토리 다중 필터바 (디렉토리 뷰에서만 표시) -->
    <section id="workspace-filter-bar" class="shrink-0"></section>

    <!-- 가운데 메인 스크롤 영역 -->
    <section id="workspace-content" class="flex-1 overflow-y-auto p-6 select-text"></section>
  </main>

  <!-- 우측 슬라이드 상세 프로필 & 추천 매칭 패널 -->
  <aside
    id="profile-detail-drawer"
    class="hidden w-[420px] shrink-0 h-full bg-white border-l border-zinc-200 shadow-lg z-20 select-text"
  ></aside>

  <!-- Supabase 설정 & 관리자 로그인 모달 -->
  <div
    id="supabase-modal"
    class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-[1px] flex items-center justify-center p-4 select-text"
  ></div>

  <!-- 전체화면 원본 사진 뷰어 (Lightbox Modal) -->
  <div
    id="photo-lightbox-modal"
    class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-xs flex flex-col items-center justify-between p-4 sm:p-6 select-none"
  ></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
